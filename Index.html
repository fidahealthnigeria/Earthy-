<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken Burns Slideshow Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090d16;
            font-family: system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            gap: 15px;
        }
        .toolbar {
            background: #1e293b;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #334155;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select {
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .player-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 500px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 35px -10px rgba(0, 0, 0, 0.7);
            border: 1px solid #334155;
        }
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            overflow: hidden;
        }
        .slide.active { opacity: 1; }
        .slide img {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scale(1);
            transition: transform linear;
        }
        /* Pan and Zoom variations */
        .slide.active.pan-center img { transform-origin: center center; transform: scale(var(--zoom-level, 1.3)); transition-duration: var(--duration, 6s); }
        .slide.active.pan-tl img { transform-origin: top left; transform: scale(var(--zoom-level, 1.3)); transition-duration: var(--duration, 6s); }
        .slide.active.pan-br img { transform-origin: bottom right; transform: scale(var(--zoom-level, 1.3)); transition-duration: var(--duration, 6s); }
        .slide.active.pan-tr img { transform-origin: top right; transform: scale(var(--zoom-level, 1.3)); transition-duration: var(--duration, 6s); }
        .slide.active.pan-bl img { transform-origin: bottom left; transform: scale(var(--zoom-level, 1.3)); transition-duration: var(--duration, 6s); }
        
        .caption {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #334155;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Category Toolbar -->
    <div class="toolbar">
        <label for="categorySelect">Category:</label>
        <select id="categorySelect">
            <option value="nature">Nature</option>
            <option value="architecture">Architecture</option>
        </select>
    </div>

    <!-- Slideshow Player -->
    <div class="player-container" id="playerContainer">
        <!-- Slides inserted dynamically via JS -->
    </div>

    <script>
        let slideshowData = {};
        let currentIndex = 0;
        let slideInterval = null;
        const panClasses = ['pan-center', 'pan-tl', 'pan-br', 'pan-tr', 'pan-bl'];

        // 1. Fetch JSON file on load
        fetch('pictures.json')
            .then(response => response.json())
            .then(data => {
                slideshowData = data;
                initCategory('nature'); // Default category
            })
            .catch(error => console.error('Error loading pictures.json:', error));

        // 2. Handle Category Selection Change
        document.getElementById('categorySelect').addEventListener('change', (e) => {
            initCategory(e.target.value);
        });

        function initCategory(categoryName) {
            clearInterval(slideInterval);
            currentIndex = 0;

            const container = document.getElementById('playerContainer');
            container.innerHTML = ''; // Clear old slides

            const items = slideshowData[categoryName];
            if (!items || items.length === 0) return;

            // 3. Build slides dynamically from JSON objects
            items.forEach((item, index) => {
                const slide = document.createElement('div');
                slide.className = `slide ${index === 0 ? 'active ' + panClasses[0] : ''}`;
                
                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.caption;
                slide.appendChild(img);

                if (item.caption) {
                    const caption = document.createElement('div');
                    caption.className = 'caption';
                    caption.textContent = item.caption;
                    slide.appendChild(caption);
                }

                container.appendChild(slide);
            });

            // Start the loop
            slideInterval = setInterval(showNextSlide, 5000);
        }

        function showNextSlide() {
            const slides = document.querySelectorAll('.slide');
            if (slides.length <= 1) return;

            slides[currentIndex].classList.remove('active');

            currentIndex = (currentIndex + 1) % slides.length;
            const nextSlide = slides[currentIndex];

            // Assign random Ken Burns effect
            const randomPan = panClasses[Math.floor(Math.random() * panClasses.length)];
            nextSlide.className = `slide ${randomPan}`;
            
            void nextSlide.offsetWidth; // Force reflow
            nextSlide.classList.add('active');
        }
    </script>
</body>
</html>
